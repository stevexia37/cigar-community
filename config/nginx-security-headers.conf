# Security Headers & WAF 加固配置
# 部署位置: /etc/nginx/conf.d/security-headers.conf
# 适用: Nginx 反向代理（生产服务器）

# ─── HTTPS 强制跳转 ───
server {
    listen 80;
    server_name cigaraficionado-china.com www.cigaraficionado-china.com;
    return 301 https://$host$request_uri;
}

# ─── 生产环境 ───
server {
    listen 443 ssl http2;
    server_name cigaraficionado-china.com www.cigaraficionado-china.com;

    # SSL（由 Cloudflare 边缘证书或 Let's Encrypt 签发）
    ssl_certificate     /etc/ssl/certs/cigaraficionado-china.com.pem;
    ssl_certificate_key /etc/ssl/private/cigaraficionado-china.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # ─── 安全头 ───
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header X-XSS-Protection             "1; mode=block" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.cigaraficionado-china.com;" always;

    # ─── WAF 等级限制 ───
    # 限制请求速率：每个 IP 每秒最多 30 个请求，突发 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # ─── 注册接口额外限制 ───
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
    location /api/auth/register {
        limit_req zone=register_limit burst=5 nodelay;
        # 加上 Turnstile / reCAPTCHA 验证
        proxy_pass http://127.0.0.1:3000;
    }

    # ─── 阻止常见恶意路径 ───
    location ~* (wp-admin|wp-login|xmlrpc|\.env|\.git|composer\.json|artisan) {
        return 403;
    }

    # ─── 限制上传大小（防大文件攻击） ───
    client_max_body_size 10M;

    # ─── 请求体超时 ───
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ─── 静态资源缓存 ───
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─── 代理传递至 Node.js / PHP 应用 ───
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
